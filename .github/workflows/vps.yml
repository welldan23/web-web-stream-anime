# Alat VPS: jalanin perintah cek/perawatan di VPS lewat GitHub (Actions → VPS tools → Run workflow).
# Pakai secret yang sama kayak deploy.yml. Di VPS, kunci deploy dikunci sama scripts/ssh-gate.sh,
# jadi cuma aksi di bawah ini yang bisa jalan (isi aksinya di scripts/vps-tools.sh):
#   status        kondisi server, pm2, versi kode, cek Animeku & wajik
#   logs          log pm2 Animeku & proses lain
#   check-sources cek VPS bisa nyambung ke Jikan/Kitsu/AniList/animeapi/otakudesu (IPv4 & IPv6)
#   restart       restart Animeku
#   deploy        git pull + build + restart (sama kayak deploy otomatis)
name: VPS tools

on:
  workflow_dispatch:
    inputs:
      action:
        description: Aksi
        type: choice
        options: [status, logs, check-sources, restart, deploy]
        default: status

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Cek secret
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum diisi (lihat README bagian Deploy otomatis)."
              exit 1
            fi
          done

      - name: Siapin SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Jalanin "${{ inputs.action }}" di VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "$ACTION"
