# Deploy otomatis ke VPS tiap ada push ke master: SSH ke VPS dan minta aksi "deploy".
# Di VPS, kunci deploy dikunci sama scripts/ssh-gate.sh (cuma boleh status/logs/check-sources/
# restart/deploy); "deploy" = `git pull` + scripts/deploy.sh (build + restart pm2).
#
# Isi di Settings → Secrets and variables → Actions → Secrets:
#   VPS_HOST         alamat VPS, mis. 145.79.11.57
#   VPS_USER         user SSH, mis. root
#   VPS_SSH_KEY      isi kunci privat khusus deploy (lihat README "Deploy otomatis")
#   VPS_KNOWN_HOSTS  hasil `ssh-keyscan` VPS, biar yakin nyambung ke VPS yang bener
#   VPS_APP_DIR      folder project di VPS, mis. /root/web-web-stream-anime (buat ngecek aja;
#                    folder yang dipakai beneran ditulis di authorized_keys)
#   VPS_PORT         (opsional) port SSH, default 22
# Selama secret-nya belum diisi, deploy dilewatin (nggak bikin error).
name: Deploy VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - name: Cek secret
        id: check
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_APP_DIR; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Secret belum diisi:$missing — deploy dilewatin."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapin SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" deploy
