<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1e17" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Blok di bawah = meta tag bawaan. Di Vercel, api/meta.ts ganti blok ini
      sesuai halaman (judul anime, poster, dll) biar preview link & Google rapi.
      Begitu React jalan, tag [data-seo] dihapus dan diganti komponen <Seo>.
    -->
    <!--seo-->
    <title data-seo>Animeku – Nonton Anime Sub Indo Gratis</title>
    <meta data-seo name="description" content="Nonton anime subtitle Indonesia gratis. Jadwal rilis anime ongoing tiap minggu, anime tamat, cari per genre, lengkap dengan pilihan server 360p, 480p, dan 720p." />
    <meta data-seo property="og:site_name" content="Animeku" />
    <meta data-seo property="og:locale" content="id_ID" />
    <meta data-seo property="og:type" content="website" />
    <meta data-seo property="og:title" content="Animeku – Nonton Anime Sub Indo Gratis" />
    <meta data-seo property="og:description" content="Nonton anime subtitle Indonesia gratis. Jadwal rilis anime ongoing tiap minggu, anime tamat, dan cari per genre." />
    <meta data-seo property="og:image" content="/og-image.png" />
    <meta data-seo name="twitter:card" content="summary_large_image" />
    <!--/seo-->
  </head>
  <body>
    <noscript>
      <p style="padding: 16px; font-family: sans-serif; color: #f3ebe3; background: #120e0b">
        Animeku butuh JavaScript buat jalan. Aktifkan JavaScript di browser kamu ya.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
